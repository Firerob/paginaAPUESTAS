# Blueprint de Render para el game-server (Socket.IO + Postgres).
#
# GitHub Pages solo sirve archivos estaticos: el lobby (apps/web) se publica
# ahi via .github/workflows/deploy-pages.yml, pero el proceso que de verdad
# corre las partidas y mueve el dinero necesita un servidor persistente —
# este blueprint es ese servidor.
#
# Uso: en Render, "New +" -> "Blueprint" -> conectar este repo. Render lee
# este archivo y crea el web service y la base juntos.
#
# Despues del primer deploy hace falta un paso manual (ver el mensaje de la
# sesion): aplicar las migraciones, incluida la semilla de Ana/Beto.

services:
  - type: web
    name: airhockey-game-server
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # `--include=dev`: NODE_ENV=production esta seteado abajo (correcto para
    # runtime), pero npm respeta esa misma variable durante el install y por
    # defecto se salta devDependencies con ella puesta — ahi viven
    # typescript y todos los @types/*, así que el build fallaba con errores
    # de tipos implicitos (`any`) que no son un problema del codigo, son
    # paquetes de tipos que nunca se instalaron.
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build -w @ah/game-server
    startCommand: npm run start -w @ah/game-server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: airhockey-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: airhockey-auth
      - key: JWT_AUDIENCE
        value: airhockey-game
      # Uno o mas origenes separados por coma: el lobby en Render y el
      # mismo lobby servido estatico en GitHub Pages. Ajustalo si cambian.
      - key: GAME_SERVER_ORIGIN
        value: https://paginaapuestas.onrender.com,https://firerob.github.io
      - key: RAKE_BPS
        value: "500"
      - key: HOUSE_USER_ID
        value: "00000000-0000-0000-0000-0000000000ff"

databases:
  - name: airhockey-db
    plan: free
    region: oregon
