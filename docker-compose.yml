services:
  postgres:
    image: postgres:16-alpine
    container_name: ah_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airhockey
      POSTGRES_PASSWORD: airhockey
      POSTGRES_DB: airhockey
    ports:
      # Configurable: si ya tienes otro Postgres en el 5432, pon
      # POSTGRES_PORT=5433 en tu .env y ajusta DATABASE_URL.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airhockey -d airhockey"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis solo hace falta cuando corras mas de una instancia del game server:
  # adaptador de Socket.io + cola de emparejamiento compartida entre procesos.
  # Con una sola instancia puedes dejarlo apagado.
  redis:
    image: redis:7-alpine
    container_name: ah_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
